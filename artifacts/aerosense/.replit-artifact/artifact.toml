kind = "web"
previewPath = "/"
title = "AeroSense"
version = "1.0.0"
id = "artifacts/aerosense"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21850

[services.development]
run = "pnpm --filter @workspace/aerosense run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aerosense", "run", "build" ]
serve = "static"
publicDir = "artifacts/aerosense/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21850"
BASE_PATH = "/"
