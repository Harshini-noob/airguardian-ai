openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AeroSense – AI-Powered Urban Air Quality Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wards
    description: Ward / zone operations
  - name: readings
    description: AQI reading time-series
  - name: attribution
    description: AI source attribution
  - name: forecast
    description: 72-hour AQI forecast
  - name: enforcement
    description: Enforcement intelligence
  - name: advisories
    description: Citizen health advisories
  - name: chat
    description: RAG chatbot
  - name: compare
    description: Multi-ward comparisons
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /wards:
    get:
      operationId: listWards
      tags: [wards]
      summary: List all wards with latest AQI
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city (e.g. Chennai)
      responses:
        "200":
          description: List of wards with current AQI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardSummary"

  /wards/city-summary:
    get:
      operationId: getCitySummary
      tags: [wards]
      summary: City-wide AQI summary stats
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: City name (default Chennai)
      responses:
        "200":
          description: City summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySummary"

  /wards/{wardId}:
    get:
      operationId: getWard
      tags: [wards]
      summary: Get a single ward
      parameters:
        - name: wardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ward detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ward"
        "404":
          description: Not found

  /wards/{wardId}/readings:
    get:
      operationId: getWardReadings
      tags: [readings]
      summary: Historical AQI readings for a ward (last 24h)
      parameters:
        - name: wardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of AQI readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AQIReading"

  /wards/{wardId}/attribution:
    get:
      operationId: getWardAttribution
      tags: [attribution]
      summary: AI-generated pollution source attribution for a ward
      parameters:
        - name: wardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Source attribution breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribution"

  /wards/{wardId}/forecast:
    get:
      operationId: getWardForecast
      tags: [forecast]
      summary: 72-hour AQI forecast for a ward
      parameters:
        - name: wardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 72-hour forecast with confidence bands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastPoint"

  /wards/{wardId}/advisory/en:
    get:
      operationId: getWardAdvisoryEn
      tags: [advisories]
      summary: English health advisory for a ward
      parameters:
        - name: wardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Advisory card in English
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisory"

  /wards/{wardId}/advisory/ta:
    get:
      operationId: getWardAdvisoryTa
      tags: [advisories]
      summary: Tamil health advisory for a ward
      parameters:
        - name: wardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Advisory card in Tamil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisory"

  /enforcement:
    get:
      operationId: listEnforcement
      tags: [enforcement]
      summary: Prioritized enforcement recommendations
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, dispatched, resolved]
      responses:
        "200":
          description: Ordered list of enforcement actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnforcementAction"

  /compare:
    get:
      operationId: compareWards
      tags: [compare]
      summary: Compare AQI trends across multiple wards
      parameters:
        - name: wardIds
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ward IDs (e.g. 1,2,3)
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
      responses:
        "200":
          description: Comparison data per ward
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardComparison"

  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Ask AeroSense a natural-language question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI answer with sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Ward:
      type: object
      required: [id, name, city, lat, lng, population, landUseType]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        population:
          type: integer
        landUseType:
          type: string

    WardSummary:
      type: object
      required: [id, name, city, lat, lng, currentAqi, aqiCategory, topPollutant, trend, population, landUseType]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        currentAqi:
          type: integer
        aqiCategory:
          type: string
          enum: [Good, Moderate, Poor, VeryPoor, Severe, Hazardous]
        topPollutant:
          type: string
        trend:
          type: string
          enum: [up, down, stable]
        population:
          type: integer
        landUseType:
          type: string

    CitySummary:
      type: object
      required: [city, averageAqi, aqiCategory, worstWard, bestWard, totalMonitoringStations, wardsAboveSafe, topPollutant]
      properties:
        city:
          type: string
        averageAqi:
          type: integer
        aqiCategory:
          type: string
        worstWard:
          type: string
        bestWard:
          type: string
        totalMonitoringStations:
          type: integer
        wardsAboveSafe:
          type: integer
        topPollutant:
          type: string

    AQIReading:
      type: object
      required: [id, wardId, timestamp, aqiValue, pm25, pm10, no2, so2, co]
      properties:
        id:
          type: integer
        wardId:
          type: integer
        timestamp:
          type: string
          format: date-time
        aqiValue:
          type: integer
        pm25:
          type: number
        pm10:
          type: number
        no2:
          type: number
        so2:
          type: number
        co:
          type: number
        source:
          type: string

    Attribution:
      type: object
      required: [wardId, timestamp, confidenceScore, sources, summary]
      properties:
        wardId:
          type: integer
        timestamp:
          type: string
          format: date-time
        confidenceScore:
          type: number
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AttributionSource"
        summary:
          type: string

    AttributionSource:
      type: object
      required: [category, contributionPct, description]
      properties:
        category:
          type: string
        contributionPct:
          type: number
        description:
          type: string

    ForecastPoint:
      type: object
      required: [forecastTimestamp, predictedAqi, confidenceLower, confidenceUpper]
      properties:
        forecastTimestamp:
          type: string
          format: date-time
        predictedAqi:
          type: integer
        confidenceLower:
          type: integer
        confidenceUpper:
          type: integer

    EnforcementAction:
      type: object
      required: [id, wardId, wardName, priorityScore, sourceType, recommendationText, status]
      properties:
        id:
          type: integer
        wardId:
          type: integer
        wardName:
          type: string
        priorityScore:
          type: number
        sourceType:
          type: string
        recommendationText:
          type: string
        status:
          type: string
          enum: [pending, dispatched, resolved]
        evidencePoints:
          type: array
          items:
            type: string
        currentAqi:
          type: integer

    Advisory:
      type: object
      required: [wardId, wardName, language, riskLevel, messageText, generatedAt, vulnerableGroups]
      properties:
        wardId:
          type: integer
        wardName:
          type: string
        language:
          type: string
          enum: [en, ta]
        riskLevel:
          type: string
          enum: [low, moderate, high, severe]
        messageText:
          type: string
        generatedAt:
          type: string
          format: date-time
        vulnerableGroups:
          type: array
          items:
            type: string

    WardComparison:
      type: object
      required: [wardId, wardName, readings, avgAqi, interventionEffectiveness]
      properties:
        wardId:
          type: integer
        wardName:
          type: string
        readings:
          type: array
          items:
            $ref: "#/components/schemas/AQIReading"
        avgAqi:
          type: number
        interventionEffectiveness:
          type: string

    ChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        city:
          type: string

    ChatResponse:
      type: object
      required: [answer, sources]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
